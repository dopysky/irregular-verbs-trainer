<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315efb">
<link rel="manifest" href="manifest.webmanifest">
<title>Тренажёр неправильных глаголов</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#20242b;--muted:#6d7480;--line:#e1e4e8;--accent:#315efb;--good:#17864b;--bad:#c93636}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}
h1{font-size:28px;margin:0 0 6px}.sub{color:var(--muted)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:11px 14px;font-size:15px;cursor:pointer}
button:hover{border-color:#b8bec7} button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)} button:disabled{opacity:.55;cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 4px 20px #00000008}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.stat{padding:15px;border:1px solid var(--line);border-radius:12px}.stat b{display:block;font-size:24px;margin-top:4px}
.muted{color:var(--muted)} .verb{font-size:34px;font-weight:700;margin:8px 0}.ru{font-size:20px;margin:8px 0 18px}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form{border:1px solid var(--line);padding:15px;border-radius:12px}.form small{display:block;color:var(--muted);margin-bottom:5px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.answer{text-align:left;min-height:58px}
.answer.correct{border-color:var(--good);background:#effaf3}.answer.wrong{border-color:var(--bad);background:#fff0f0}
.progress{height:8px;background:#e8eaee;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}
.big{font-size:22px;font-weight:700}.center{text-align:center}.hidden{display:none!important}
.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:40px 1fr 1fr 1fr 1.4fr;gap:8px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
input{padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;width:100%}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.forms{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.row{grid-template-columns:30px 1fr 1fr}.row .hide-m{display:none}}
</style>
</head>

<div class="wrap">
<header>
<div><h1>Тренажёр неправильных глаголов</h1><div class="sub">151 глагол из твоего документа</div></div>
</header>
<nav>
<button id="nav-home">Главная</button>
<button id="nav-learn">Изучение</button>
<button id="nav-quiz">Тренировка</button>
<button id="nav-errors">Повторить ошибки</button>
<button id="nav-list">Все глаголы</button>
</nav>

<section id="home" class="panel">
<h2>Прогресс</h2>
<div class="grid">
<div class="stat">Всего<b id="s-total">151</b></div>
<div class="stat">Изучено<b id="s-known">0</b></div>
<div class="stat">Ошибки<b id="s-bad">0</b></div>
<div class="stat">Ответов<b id="s-answers">0</b></div>
</div>
<p class="muted">Начнём с первых 15 глаголов. Программа сама будет учитывать правильные и неправильные ответы.</p>
<div class="actions"><button id="start-quiz" class="primary">Начать тренировку</button><button id="start-learn">Посмотреть первые 15</button></div>
</section>

<section id="learn" class="panel hidden">
<h2>Первые 15 глаголов</h2>
<div id="learn-list" class="list"></div>
</section>

<section id="quiz" class="panel hidden">
<div class="muted" id="q-count"></div>
<div class="progress"><div class="bar" id="q-bar"></div></div>
<div class="center">
<div class="big" id="q-type"></div>
<div class="verb" id="q-word"></div>
<div class="ru" id="q-ru"></div>
</div>
<div id="answers" class="answers"></div>
<div class="actions"><button id="next" class="primary" disabled>Далее</button><button id="finish">Закончить</button></div>
<div id="feedback" class="muted" style="margin-top:14px"></div>
</section>

<section id="list" class="panel hidden">
<h2>Все 151 глагол</h2>
<input id="search" placeholder="Поиск..." oninput="renderList()">
<div id="all-list" class="list" style="margin-top:12px"></div>
</section>
</div>

function save(){localStorage.setItem(KEY,JSON.stringify(state));updateStats()}
function rec(v,ok){
  const x=state[v.n]||{ok:0,bad:0};
  ok?x.ok++:x.bad++;
  state[v.n]=x; save();
}
function updateStats(){
  const vals=Object.values(state);
  document.getElementById('s-known').textContent=vals.filter(x=>x.ok>=3 && x.bad===0).length;
  document.getElementById('s-bad').textContent=vals.filter(x=>x.bad>0).length;
  document.getElementById('s-answers').textContent=vals.reduce((a,x)=>a+x.ok+x.bad,0);
}
function show(id){
  document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='learn') renderLearn();
  if(id==='list') renderList();
  updateStats();
}

}
function renderList(){
  const s=(document.getElementById('search').value||'').toLowerCase();
  document.getElementById('all-list').innerHTML=verbs.filter(v=>

}
function weightedPool(errorsOnly=false){
  let pool=[];
  verbs.forEach(v=>{
    const x=state[v.n]||{ok:0,bad:0};
    if(errorsOnly && x.bad===0)return;
    let w=1+x.bad*3+(x.ok<2?2:0);
    for(let i=0;i<w;i++) pool.push(v);
  });
  return pool;
}
function pick(pool){
  return pool[Math.floor(Math.random()*pool.length)];
}
function startQuiz(errorsOnly=false){
  let pool=weightedPool(errorsOnly);
  if(!pool.length){alert('Пока нет ошибок для повторения.'); return;}
  quiz=[]; let used=new Set();
  const target=Math.min(10, errorsOnly?Math.min(10,new Set(pool.map(v=>v.n)).size):10);
  while(quiz.length<target){
    const v=pick(pool); if(!used.has(v.n)){used.add(v.n);quiz.push(makeQuestion(v));}
  }
  qi=0; show('quiz'); renderQ();
}
function makeQuestion(v){
  const modes=['past','part','ru'];
  const mode=modes[Math.floor(Math.random()*modes.length)];
  let correct, prompt, type;
  if(mode==='past'){correct=v.past;prompt='Выбери Past Simple';type=v.inf}
  if(mode==='part'){correct=v.part;prompt='Выбери Past Participle';type=v.inf}
  if(mode==='ru'){correct=v.inf;prompt='Выбери глагол по переводу';type=v.ru}
  let choices=[correct];
  const others=verbs.filter(x=>x.n!==v.n);
  while(choices.length<4){
    const c=others[Math.floor(Math.random()*others.length)];
    const val=mode==='past'?c.past:mode==='part'?c.part:c.inf;
    if(!choices.includes(val)) choices.push(val);
  }
  choices.sort(()=>Math.random()-.5);
  return {v,correct,choices,prompt,type};
}
function renderQ(){
  selected=false; document.getElementById('next').disabled=true;
  const q=quiz[qi];
  document.getElementById('q-count').textContent=`Вопрос ${qi+1} из ${quiz.length}`;
  document.getElementById('q-bar').style.width=((qi)/quiz.length*100)+'%';
  document.getElementById('q-type').textContent=q.prompt;
  document.getElementById('q-word').textContent=q.type;
  document.getElementById('q-ru').textContent=q.prompt.includes('переводу')?'':q.v.ru;
  document.getElementById('feedback').textContent='';
  document.getElementById('answers').innerHTML=q.choices.map((a,i)=>
    `<button class="answer" data-answer="${htmlAttr(a)}">${String.fromCharCode(65+i)}. ${a}</button>`
  ).join('');
}
function answer(btn,val){
  if(selected)return; selected=true;
  const q=quiz[qi], ok=val===q.correct;
  document.querySelectorAll('.answer').forEach(b=>{
    const t=b.textContent.replace(/^[A-D]\.\s*/,'');
    if(t===q.correct)b.classList.add('correct');
  });
  if(!ok)btn.classList.add('wrong');
  rec(q.v,ok);
  document.getElementById('feedback').textContent=ok?'Правильно.':`Ошибка. Правильно: ${q.correct}`;
  document.getElementById('next').disabled=false;
}
function nextQ(){
  if(!selected)return;
  qi++;
  if(qi>=quiz.length){document.getElementById('q-bar').style.width='100%';alert('Тренировка закончена. Прогресс сохранён.');show('home');return;}
  renderQ();
}
function htmlAttr(v){return String(v).replace(/&/g,'&amp;').replace(/\"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.getElementById('nav-home').addEventListener('click',()=>show('home'));
document.getElementById('nav-learn').addEventListener('click',()=>show('learn'));
document.getElementById('nav-quiz').addEventListener('click',()=>startQuiz(false));
document.getElementById('nav-errors').addEventListener('click',()=>startQuiz(true));
document.getElementById('nav-list').addEventListener('click',()=>show('list'));
document.getElementById('start-quiz').addEventListener('click',()=>startQuiz(false));
document.getElementById('start-learn').addEventListener('click',()=>show('learn'));
document.getElementById('next').addEventListener('click',nextQ);
document.getElementById('finish').addEventListener('click',()=>show('home'));
document.getElementById('answers').addEventListener('click',(e)=>{
  const btn=e.target.closest('.answer');
  if(!btn)return;
  answer(btn, btn.dataset.answer);
});
renderLearn(); renderList(); updateStats();
</script>
